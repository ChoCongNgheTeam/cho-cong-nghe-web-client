name: CI

# Chạy khi có PR nhắm vào các nhánh chính, và khi push trực tiếp lên chúng
# (vd. merge). Không chạy trên mọi nhánh để tránh tốn phút Actions miễn phí.
on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [main, dev]

# Nếu có commit mới đẩy lên trong lúc CI cũ của cùng PR/nhánh đang chạy, huỷ
# lượt cũ — tránh lãng phí phút chạy trên các commit đã lỗi thời.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Typecheck, lint, test, build
    runs-on: ubuntu-latest

    # BẮT BUỘC có biến này ở bước build — config/api.config.ts đọc
    # NEXT_PUBLIC_API_BASE_URL bằng non-null assertion (!), thiếu biến sẽ làm
    # build fail ngay cả khi không có BE thật để gọi (CI không cần BE chạy
    # thật, next build vẫn tolerate được fetch fail — đã verify trong quá
    # trình phát triển, xem log "Không thể kết nối đến server" là bình
    # thường, không phải lỗi build).
    env:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:4000/api
      NEXT_PUBLIC_BASE_URL: http://localhost:3000
      NEXT_PUBLIC_SITE_URL: http://localhost:3000

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        # Không pin version cứng ở đây — đọc từ packageManager trong
        # package.json nếu có, nếu không dùng bản pnpm/action-setup mặc định.
        # Nếu team muốn khoá cứng version, thêm "with: { version: 11 }".

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # next@16 yêu cầu tối thiểu Node 20.9 (package.json của next có
          # engines.node >=20.9.0) — dùng 20 LTS cho ổn định thay vì bản mới
          # nhất chưa được nhiều package hỗ trợ đầy đủ.
          node-version: "20"
          cache: "pnpm"

      - name: Install dependencies
        # --frozen-lockfile: KHÔNG cho phép pnpm tự ý cập nhật lockfile trong
        # CI — nếu package.json và pnpm-lock.yaml lệch nhau (quên chạy pnpm
        # install sau khi sửa package.json), build fail ngay tại đây thay vì
        # âm thầm cài version khác với máy dev.
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run typecheck

      - name: Lint
        run: pnpm run lint

      - name: Format check (informational — không chặn CI)
        # continue-on-error: TRUE có chủ đích, cùng lý do với bước Audit bên dưới.
        # Repo có ~500 file legacy chưa từng chạy qua Prettier với cấu hình hiện
        # tại (chủ yếu do dòng dài chưa wrap theo printWidth: 140, không phải lỗi
        # CRLF) — xem CODE_REVIEW.md mục 3.3. Chặn CI vì việc này sẽ khiến MỌI PR
        # đỏ bất kể PR đó sửa gì, không có tín hiệu hữu ích. Husky + lint-staged
        # (đã cấu hình ở .husky/pre-commit) tự format các file THỰC SỰ bị sửa
        # trong mỗi commit, nên repo sẽ dần về chuẩn theo thời gian mà không cần
        # 1 lần reformat khổng lồ. Bước này vẫn chạy để nhìn thấy tiến độ dọn dần.
        run: pnpm run format:check
        continue-on-error: true

      - name: Unit tests
        run: pnpm run test:coverage

      - name: Build
        run: pnpm run build

      - name: Audit (informational — không chặn CI)
        # continue-on-error: TRUE có chủ đích. Tại thời điểm viết workflow này,
        # còn đúng 1 lỗ hổng "high" (sharp/libvips) tồn tại trong dependency
        # NỘI BỘ của chính package `next`, không thể tự vá qua package.json
        # của repo này, và rủi ro thực tế = 0 vì next.config.ts đã tắt hẳn
        # tính năng dùng tới sharp (images.unoptimized: true). Xem
        # CODE_REVIEW.md mục 7.5 để biết chi tiết đầy đủ. Để audit CHẶN CI vì
        # 1 lỗ hổng không thể tự sửa và không có rủi ro thật sẽ khiến CI đỏ
        # vĩnh viễn một cách vô ích — vẫn chạy để CÓ THÔNG BÁO nếu phát sinh
        # lỗ hổng MỚI, nhưng không chặn merge.
        run: pnpm audit --audit-level=high
        continue-on-error: true

  # E2E (Playwright) CỐ Ý không đưa vào CI này — cần backend thật đang chạy để
  # test có ý nghĩa (login, checkout...), và CI không có BE. Chạy E2E thủ công
  # ở máy dev (pnpm test:e2e) sau khi mở BE, xem TEST_PLAN.md mục 5.3. Nếu sau
  # này có BE deploy ở môi trường staging cố định, có thể thêm job E2E riêng
  # trỏ tới URL staging đó.
